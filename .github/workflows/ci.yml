name: CI

on:
  push:
    paths-ignore:
      - README.md
  pull_request:
    paths-ignore:
      - README.md

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest --cov=app --cov-report=term-missing

  container:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        if: github.event_name == 'pull_request'
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        if: github.event_name == 'pull_request'
      - name: Build amd64 smoke image
        run: docker build --platform linux/amd64 --tag replaygain-watcher:ci .
      - name: Build all supported platforms
        uses: docker/build-push-action@v7
        if: github.event_name == 'pull_request'
        with:
          context: .
          platforms: linux/amd64,linux/arm/v7,linux/arm64
          tags: replaygain-watcher:multiarch-ci
          push: false
          provenance: false
          sbom: false
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: replaygain-watcher:ci
          format: spdx-json
          output-file: sbom.spdx.json
          upload-release-assets: true
      - name: Scan image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: replaygain-watcher:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
